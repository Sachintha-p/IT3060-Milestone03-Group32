# =====================================================================
# application-dev.properties — Development profile overrides
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================

# ---- Database: Neon PostgreSQL (shared dev DB) ----
# Connection details are in application.properties.
# This profile overrides ONLY the JPA behaviour for local development.

# Auto-create / update schema in dev so Hibernate builds the tables
# for you on first run. Switch to 'validate' before going to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Verbose logging for debugging ----
logging.level.com.library=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

