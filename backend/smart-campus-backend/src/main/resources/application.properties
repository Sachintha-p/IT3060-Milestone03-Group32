# =====================================================================
# Smart Library System — Main Application Configuration
# Secrets are read from environment variables. Safe defaults are
# provided for local development. Never commit real secrets here.
# =====================================================================

spring.application.name=smart-campus-backend

# --- Database (Neon PostgreSQL) ---
# Override DB_URL / DB_USERNAME / DB_PASSWORD env vars in production.
# The defaults below point to the shared Neon dev database.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-spring-sunset-b489m5c6-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_WtjB87EPmUzA}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP (connection pool tuned for Neon serverless) ---
# Neon pauses idle connections; keep pool small to avoid stale sockets.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto is set per-profile (see application-dev.properties)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT ---
# Generate a strong Base64-encoded 256-bit key for JWT_SECRET in prod.
# Example (OpenSSL): openssl rand -base64 32
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIFNtYXJ0TGli}
# Token expiry: 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Server ---
server.port=8080

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
